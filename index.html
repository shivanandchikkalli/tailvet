<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TailVet helps pet owners connect with veterinarians and manage pet care.">
  <title>TailVet — Care for every tail</title>
  <style>
    :root { color-scheme: light; --ink:#1f2733; --muted:#68727d; --brand:#2e7d6b; --line:#dfe7e4; --bg:#f4f8f6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%, 560px); text-align:center; }
    .logo { width:104px; height:104px; margin:0 auto 20px; display:block; }
    h1 { margin:0; color:var(--brand); font-size:36px; }
    .tagline { margin:4px 0 32px; color:var(--muted); }
    nav { display:grid; gap:12px; }
    a { display:block; padding:14px 18px; border:1px solid var(--line); border-radius:8px; background:white; color:var(--brand); font-weight:650; text-decoration:none; }
    a:hover, a:focus-visible { border-color:var(--brand); outline:2px solid transparent; }
    footer { margin-top:32px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 512 512" role="img" aria-label="TailVet paw and heartbeat logo" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse"><stop stop-color="#2e7d6b"/><stop offset="1" stop-color="#20574c"/></linearGradient></defs>
      <rect width="512" height="512" rx="112" fill="url(#bg)"/>
      <path d="M96 300h88l30-64 42 114 44-82 22 32h94" stroke="#fff" stroke-opacity=".28" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <g fill="#fff"><path d="M256 300c-34 0-60 24-60 52 0 22 18 34 40 34 8 0 14-3 20-3s12 3 20 3c22 0 40-12 40-34 0-28-26-52-60-52Z"/><ellipse cx="196" cy="266" rx="22" ry="28"/><ellipse cx="316" cy="266" rx="22" ry="28"/><ellipse cx="230" cy="228" rx="20" ry="26"/><ellipse cx="282" cy="228" rx="20" ry="26"/></g>
      <path d="M330 320c62-20 78-84 42-124" stroke="#f4a259" stroke-width="26" stroke-linecap="round" fill="none"/><circle cx="372" cy="196" r="15" fill="#f4a259"/>
    </svg>
    <h1>TailVet</h1>
    <p class="tagline">Care for every tail</p>
    <nav aria-label="Legal information">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="account-deletion.html">Delete Your Account</a>
    </nav>
    <footer>Pet care information and veterinarian consultations.</footer>
  </main>
</body>
</html>
